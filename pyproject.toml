[project]
name = "pjvoice"
version = "0.1.0"
description = "Open source AI phone agent that books, moves and cancels real appointments safely."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
voice = [
    "livekit-agents[silero,turn-detector]>=1.2,<2",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pjvoice = "pjvoice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pjvoice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
